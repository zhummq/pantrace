    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#060b12" />
    <script>
      /* 主题预置：必须在样式生效前跑，否则刷新时会先闪一下默认配色。
         键名与 src/theme.js 的 STORAGE_KEY 保持一致，两边改一处就要同步。 */
      (function () {
        var bg = { mint: '#060b12', azure: '#06101c', violet: '#0a0716', amber: '#120c07', light: '#f4f6fa' }
        try {
          var t = localStorage.getItem('pantrace:theme')
          if (!t || !bg[t]) return
          document.documentElement.dataset.theme = t
          var m = document.querySelector('meta[name="theme-color"]')
          if (m) m.setAttribute('content', bg[t])
          var c = document.querySelector('meta[name="color-scheme"]')
          if (c) c.setAttribute('content', t === 'light' ? 'light' : 'dark light')
        } catch (e) {}
      })()
    </script>
