<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#060b12" />
    <script>
      /* 与主站同一套主题：管理端跟主站共用 localStorage 键，换一次两边都变 */
      (function () {
        var bg = { mint: '#060b12', azure: '#06101c', violet: '#0a0716', amber: '#120c07', light: '#f4f6fa' }
        try {
          var t = localStorage.getItem('pantrace:theme')
          if (!t || !bg[t]) return
          document.documentElement.dataset.theme = t
          var m = document.querySelector('meta[name="theme-color"]')
          if (m) m.setAttribute('content', bg[t])
          var c = document.querySelector('meta[name="color-scheme"]')
          if (c) c.setAttribute('content', t === 'light' ? 'light' : 'dark light')
        } catch (e) {}
      })()
    </script>
    <title>盘迹 · 看板</title>
  </head>
  <body>
    <div id="admin"></div>
    <script type="module" src="/src/admin/main.js"></script>
  </body>
</html>
